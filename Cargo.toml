[package]
name = "filepipe"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
chrono = "0.4.43"
chrono-tz = "0.10.4"
async-trait = "0.1.89"
dotenvy = "0.15.7"

axum = { version = "0.8.8", features = ["query", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
axum-macros = "0.5.0"
serde_json = "1.0.149"
serde_with = "3.22.0"
axum-range = "1.0.0"

tower-http = { version = "0.7.0", features = ["cors", "fs"] }
tower = "0.5.3"

mlua = { version = "0.12.0", features = ["lua55", "vendored", "async", "send"] }
xxh3 = "0.1.1"
cargo-watch = "8.5.3"
rand = { version = "0.10.2", features = ["thread_rng"] }
ed25519-dalek = { version = "3.0.0", features = ["pkcs8", "pem"] }
ssh-key = "0.6.7"
clap = "4.6.6"
reqwest = { version = "0.13.4", features = ["json"] }
